<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Import Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

  <!-- React + MUI UMD -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@mui/material@5.15.10/umd/material-ui.development.js" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { font-family: 'DM Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(128,128,128,0.5); }
  </style>

  <!-- Validation + store (plain JS) -->
  <script src="components/validation.js"></script>
  <script src="components/ProjectStore.js"></script>
</head>
<body>
<div id="root"></div>

<!-- Component scripts -->
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components/theme.jsx"></script>
<script type="text/babel" src="components/ProjectConfig.jsx"></script>
<script type="text/babel" src="components/UploadMapping.jsx"></script>
<script type="text/babel" src="components/ReviewTable.jsx"></script>
<script type="text/babel" src="components/ReviewStep.jsx"></script>
<script type="text/babel" src="components/AddUserModal.jsx"></script>
<script type="text/babel" src="components/ProjectPicker.jsx"></script>

<script type="text/babel">
const {
  ThemeProvider, CssBaseline, Box, Paper, Typography, Stepper, Step,
  StepLabel, AppBar, Toolbar, IconButton, Tooltip, Fab, Chip, Stack,
  useMediaQuery, Badge,
} = MaterialUI;

// ── Tweaks defaults ──────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "colorMode": "light",
  "accentColor": "#159e87",
  "density": "normal",
  "showRowNumbers": true
}/*EDITMODE-END*/;

// Icons (inline SVG)
const MoonIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
);
const SunIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/>
    <line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/>
    <line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
);
const PersonAddIcon = () => (
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
    <circle cx="8.5" cy="7" r="4"/>
    <line x1="20" y1="8" x2="20" y2="14"/>
    <line x1="23" y1="11" x2="17" y2="11"/>
  </svg>
);
const SettingsIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
  </svg>
);

// ── Screen constants ─────────────────────────────────────────────────────────
// 'home' | 'config' | 'upload' | 'review'

const DEFAULT_CONFIG = {
  id: null,
  projectName: '',
  baseUrl: '',
  auth: { type: 'bearer', value: '' },
  endpoints: [
    { id: 'create', label: 'Create User', method: 'POST', path: '/users' },
    { id: 'bulk', label: 'Bulk Import', method: 'POST', path: '/users/bulk' },
  ],
};

function App() {
  const prefersDark = useMediaQuery('(prefers-color-scheme: dark)');
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const colorMode = tweaks.colorMode === 'system'
    ? (prefersDark ? 'dark' : 'light')
    : tweaks.colorMode;

  const theme = React.useMemo(() => window.getTheme(colorMode), [colorMode]);

  // ── Navigation state ──────────────────────────────────────────────────────
  const [screen, setScreen] = React.useState('home'); // home | config | upload | review
  const [importStep, setImportStep] = React.useState(0); // 0=upload 1=review

  // ── Project config ────────────────────────────────────────────────────────
  const [config, setConfig] = React.useState(DEFAULT_CONFIG);
  const [editingProject, setEditingProject] = React.useState(null); // project being edited

  // ── Upload/mapping state ──────────────────────────────────────────────────
  const [rawData, setRawData] = React.useState(null);
  const [mapping, setMapping] = React.useState({});
  const [rows, setRows] = React.useState([]);
  const [fields, setFields] = React.useState([]);

  // ── Modal ─────────────────────────────────────────────────────────────────
  const [addUserOpen, setAddUserOpen] = React.useState(false);
  const [addUserConfig, setAddUserConfig] = React.useState(null);

  // ── Helpers ───────────────────────────────────────────────────────────────
  const isImporting = screen === 'upload' || screen === 'review';
  const importStepIndex = screen === 'upload' ? 0 : screen === 'review' ? 1 : -1;
  const errorCount = rows.filter(r => Object.keys(r._errors || {}).length > 0).length;

  // Save config & proceed to upload
  const handleConfigSave = (cfg) => {
    const toSave = cfg.id ? cfg : { ...cfg, id: window.ProjectStore.generateId() };
    window.ProjectStore.upsertProject(toSave);
    setConfig(toSave);
    setScreen('upload');
    setImportStep(0);
    setRawData(null);
    setMapping({});
    setRows([]);
    setFields([]);
  };

  // Pick a saved project → go straight to upload
  const handleSelectProject = (project) => {
    setConfig(project);
    window.ProjectStore.setLastProjectId(project.id);
    setScreen('upload');
    setImportStep(0);
    setRawData(null);
    setMapping({});
    setRows([]);
    setFields([]);
  };

  // Edit existing project
  const handleEditProject = (project) => {
    setConfig(project || DEFAULT_CONFIG);
    setScreen('config');
  };

  // Create new project
  const handleCreateNew = () => {
    setConfig({ ...DEFAULT_CONFIG, id: null });
    setScreen('config');
  };

  // Mapping → review
  const handleMappingNext = () => {
    const mapped = window.applyMapping(rawData.rows, mapping);
    const validated = window.validateAllRows(mapped);
    const activeFields = Object.keys(mapping).filter(k => mapping[k] && mapping[k] !== '_skip');
    setRows(validated);
    setFields(activeFields);
    setScreen('review');
  };

  const handleFileLoad = (parsed, autoMap) => {
    if (!parsed) { setRawData(null); setMapping({}); return; }
    setRawData({ ...parsed, fileName: 'users.csv' });
    setMapping(autoMap);
  };

  // Open add-user modal with a specific project (from picker) or current config
  const handleAddUser = (project) => {
    setAddUserConfig(project || config);
    setAddUserOpen(true);
  };

  // Breadcrumb label
  const configLabel = config.projectName || 'New Project';

  return (
    <ThemeProvider theme={theme}>
      <CssBaseline />

      <Box sx={{ minHeight: '100%', bgcolor: 'background.default' }}>
        {/* App bar */}
        <AppBar position="sticky" color="default" elevation={0} sx={{ borderBottom: '1px solid', borderColor: 'divider' }}>
          <Toolbar sx={{ gap: 1.5 }}>
            <Box sx={{ display: 'flex', alignItems: 'center', gap: 1 }}>
              <Box sx={{ width: 30, height: 30, borderRadius: '50%', bgcolor: 'primary.main', color: '#fff', display: 'grid', placeItems: 'center', fontWeight: 700 }}>
                U
              </Box>
              <Typography variant="h6" fontWeight={800} sx={{ letterSpacing: '-0.02em' }}>User Import</Typography>
            </Box>

            <Box sx={{ flex: 1 }} />

            <Stack direction="row" spacing={1} alignItems="center">
              <Chip label={configLabel} variant="outlined" size="small" />
              <Tooltip title={colorMode === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'}>
                <IconButton size="small" onClick={() => setTweak('colorMode', colorMode === 'dark' ? 'light' : 'dark')}>
                  {colorMode === 'dark' ? <MoonIcon /> : <SunIcon />}
                </IconButton>
              </Tooltip>
              <Tooltip title="Settings">
                <IconButton size="small"><SettingsIcon /></IconButton>
              </Tooltip>
            </Stack>
          </Toolbar>
        </AppBar>

        {/* Steps */}
        <Box sx={{ maxWidth: 1100, mx: 'auto', px: { xs: 2, md: 3 }, py: 3 }}>
          {isImporting && (
            <Paper variant="outlined" sx={{ p: 2, mb: 3, borderRadius: 2 }}>
              <Stepper activeStep={importStepIndex} alternativeLabel>
                {['Upload', 'Review'].map((label, i) => (
                  <Step key={label} completed={i < importStepIndex}>
                    <StepLabel>{label}</StepLabel>
                  </Step>
                ))}
              </Stepper>
              {errorCount > 0 && screen === 'review' && (
                <Alert severity="warning" sx={{ mt: 2 }}>There are {errorCount} rows with errors.</Alert>
              )}
            </Paper>
          )}

          {screen === 'home' && (
            <ProjectPicker
              onSelect={handleSelectProject}
              onCreateNew={handleCreateNew}
              onEdit={handleEditProject}
              onAddUser={handleAddUser}
            />
          )}

          {screen === 'config' && (
            <ProjectConfig
              config={config}
              onChange={setConfig}
              onNext={() => handleConfigSave(config)}
              onBack={() => setScreen('home')}
              isEdit={!!config.id}
            />
          )}

          {screen === 'upload' && (
            <UploadMapping
              rawData={rawData}
              mapping={mapping}
              onMappingChange={setMapping}
              onFileLoad={handleFileLoad}
              onNext={handleMappingNext}
              onBack={() => setScreen('home')}
            />
          )}

          {screen === 'review' && (
            <ReviewStep
              rows={rows}
              fields={fields}
              config={config}
              mappedRows={rows}
              onBack={() => setScreen('upload')}
              onRowUpdate={(updated) => setRows(updated)}
              onDeleteSelected={(updated) => setRows(updated)}
            />
          )}
        </Box>

        {/* FAB — mobile add user */}
        {isImporting && config.baseUrl && (
          <Tooltip title="Add single user" placement="left">
            <Fab color="primary" size="medium" onClick={() => handleAddUser(config)}
              sx={{ position: 'fixed', bottom: 28, right: 28, display: { xs: 'flex', md: 'none' }, boxShadow: '0 4px 20px rgba(92,107,192,0.45)' }}>
              <PersonAddIcon />
            </Fab>
          </Tooltip>
        )}

        {/* Add User Modal */}
        <AddUserModal
          open={addUserOpen}
          onClose={() => { setAddUserOpen(false); setAddUserConfig(null); }}
          config={addUserConfig || config}
        />

        {/* Tweaks Panel */}
        <TweaksPanel>
          <TweakSection title="Appearance">
            <TweakRadio
              label="Color Mode"
              value={tweaks.colorMode}
              options={[{ value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }, { value: 'system', label: 'System' }]}
              onChange={v => setTweak('colorMode', v)}
            />
            <TweakColor label="Accent Color" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
            <TweakRadio
              label="Table Density"
              value={tweaks.density}
              options={[{ value: 'compact', label: 'Compact' }, { value: 'normal', label: 'Normal' }]}
              onChange={v => setTweak('density', v)}
            />
          </TweakSection>
          <TweakSection title="Table">
            <TweakToggle label="Show Row Numbers" value={tweaks.showRowNumbers} onChange={v => setTweak('showRowNumbers', v)} />
          </TweakSection>
          <TweakSection title="Demo">
            <TweakButton label="← Back to Projects" onClick={() => setScreen('home')} />
            <TweakButton
              label="Load Demo & Skip to Review"
              onClick={() => {
                const demoCSV = `email,full_name,phone,role,department\nalice@acme.com,Alice Johnson,+1-555-0101,admin,Engineering\nbob@acme.com,Bob Smith,+1-555-0102,editor,Marketing\ncarol@acme.com,Carol White,,viewer,Design\ndave.invalid,Dave Brown,555-9999,superadmin,Sales\nalice@acme.com,Alice Duplicate,,viewer,HR\neve@acme.com,Eve Davis,+1-555-0106,analyst,Data\nfrank@acme.com,,+1-555-0107,developer,Engineering\ngrace@acme.com,Grace Lee,+1-555-0108,manager,Product`;
                const parsed = window.parseCSVText(demoCSV);
                const autoMap = window.autoDetectMapping(parsed.headers);
                const mapped = window.applyMapping(parsed.rows, autoMap);
                const validated = window.validateAllRows(mapped);
                const activeFields = Object.keys(autoMap).filter(k => autoMap[k] && autoMap[k] !== '_skip');
                const demoProject = {
                  id: window.ProjectStore.generateId(),
                  projectName: 'Demo Project',
                  baseUrl: 'https://api.example.com/v1',
                  auth: { type: 'bearer', value: 'demo-token-abc123' },
                  endpoints: DEFAULT_CONFIG.endpoints,
                };
                window.ProjectStore.upsertProject(demoProject);
                setConfig(demoProject);
                setRawData({ ...parsed, fileName: 'demo-users.csv' });
                setMapping(autoMap);
                setRows(validated);
                setFields(activeFields);
                setScreen('review');
              }}
            />
          </TweakSection>
        </TweaksPanel>
      </Box>
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
